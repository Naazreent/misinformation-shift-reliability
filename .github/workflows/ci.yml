name: reproducibility-checks

on:
  push:
  pull_request:

jobs:
  tests-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Create synthetic data
        run: python scripts/make_synthetic_data.py --output data/raw/synthetic.csv --rows 600
      - name: Run synthetic smoke experiment
        run: python scripts/run_experiment.py --data data/raw/synthetic.csv --config configs/smoke.json --output-root /tmp/misinfo-artifacts

  neural-interfaces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU neural environment
        run: |
          python -m pip install -r requirements-neural-cpu.txt
          python -m pip install -e . --no-deps
      - name: Run neural interface tests
        run: python -m unittest discover -s tests -p "test_neural.py" -v
